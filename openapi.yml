components:
  schemas:
    Apartment:
      type: object
      description: Serializer for retrieving detailed information about an Apartment
        listing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          description: Title of the apartment listing.
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Detailed description of the apartment.
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Rental price of the apartment in EUR.
        address_city:
          type: string
          description: City where the apartment is located.
          maxLength: 100
        address_district:
          type: string
          description: District where the apartment is located.
          maxLength: 100
        rooms:
          type: integer
          maximum: 50
          minimum: 1
          default: 1
          description: Number of rooms in the apartment.
        property_type:
          allOf:
          - $ref: '#/components/schemas/PropertyTypeEnum'
          default: apartment
          description: |-
            Type of the property.

            * `apartment` - Apartment
            * `house` - House
            * `studio` - Studio
            * `villa` - Villa
        is_active:
          type: boolean
          description: Whether the listing is currently active.
        views_count:
          type: integer
          readOnly: true
          description: Number of times the listing has been viewed.
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          description: Average rating of the listing from 0.00 to 5.00.
        user:
          type: string
          readOnly: true
          description: User who owns the listing.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ApartmentImage'
          readOnly: true
          description: List of attached apartment images.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_city
      - address_district
      - average_rating
      - created_at
      - id
      - images
      - price
      - title
      - user
      - views_count
    ApartmentCreateUpdateRequest:
      type: object
      description: |-
        Serializer used for creating and updating (PUT/PATCH) Apartment listings.
        Delegates core business validation to the model's clean() method.
      properties:
        title:
          type: string
          minLength: 1
          description: Title of the apartment listing.
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Detailed description of the apartment.
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Rental price of the apartment in EUR.
        address_city:
          type: string
          minLength: 1
          description: City where the apartment is located.
          maxLength: 100
        address_district:
          type: string
          description: District where the apartment is located.
          maxLength: 100
        rooms:
          type: integer
          maximum: 50
          minimum: 1
          description: Number of rooms in the apartment.
        property_type:
          allOf:
          - $ref: '#/components/schemas/PropertyTypeEnum'
          description: |-
            Type of the property.

            * `apartment` - Apartment
            * `house` - House
            * `studio` - Studio
            * `villa` - Villa
        is_active:
          type: boolean
          description: Whether the listing is currently active.
      required:
      - address_city
      - price
      - title
    ApartmentImage:
      type: object
      description: Serializer for retrieving attached apartment images.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        image:
          type: string
          format: uri
        is_main:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image
    ApartmentImageUploadRequest:
      type: object
      description: |-
        Serializer used for uploading apartment images.
        Delegates validation (e.g. main image uniqueness) to Model.clean().
      properties:
        apartment:
          type: string
          format: uuid
        image:
          type: string
          format: binary
        is_main:
          type: boolean
      required:
      - apartment
      - image
    ChangePasswordRequest:
      type: object
      description: Serializer for changing the authenticated user's password.
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - new_password
      - old_password
    GenderEnum:
      enum:
      - MALE
      - FEMALE
      - OTHER
      type: string
      description: |-
        * `MALE` - Male
        * `FEMALE` - Female
        * `OTHER` - Other
    ListingControllerErrorResponse:
      type: object
      properties:
        detail:
          type: string
          default: Error detail message.
    ListingViewHistory:
      type: object
      description: Serializer for retrieving user's apartment viewing history with
        nested apartment details.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        apartment:
          allOf:
          - $ref: '#/components/schemas/Apartment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - apartment
      - created_at
      - id
    MetricsControllerErrorResponse:
      type: object
      properties:
        detail:
          type: string
          default: Error detail message.
    PaginatedApartmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Apartment'
    PaginatedListingViewHistoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ListingViewHistory'
    PaginatedReservationList:
      type: object
