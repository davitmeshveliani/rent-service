          type: string
          nullable: true
          maxLength: 150
        last_name:
          type: string
          nullable: true
          maxLength: 150
        birthday:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
          maxLength: 255
        gender:
          $ref: '#/components/schemas/GenderEnum'
        bio:
          type: string
          nullable: true
        is_active:
          type: boolean
