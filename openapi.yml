          minLength: 1
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        first_name:
          type: string
          nullable: true
          maxLength: 150
        last_name:
          type: string
          nullable: true
          maxLength: 150
        birthday:
          type: string
          format: date
          nullable: true
        address:
