openapi: 3.0.3
info:
  title: Rentify API
  version: 1.0.0
  description: Real Estate Listing and Booking Platform API
paths:
  /api/listings/:
    get:
      operationId: listings_list
      description: Public endpoint for active apartment listings with filtering, search,
        and ordering.
      summary: List active apartments
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: district
        schema:
          type: string
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: max_rooms
        schema:
          type: integer
      - in: query
        name: min_price
        schema:
          type: number
      - in: query
        name: min_rooms
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: property_type
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - listings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApartmentList'
          description: ''
    post:
      operationId: listings_create
      description: Authenticated hosts can create new property listings.
      summary: Create a new apartment listing
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApartmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApartmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApartmentCreateUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Validation Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Host access required
  /api/listings/{id}/:
    get:
      operationId: listings_retrieve
      description: Retrieves an apartment listing. Public users can access active
        listings. Owners can also access their inactive listings.
      summary: Retrieve an apartment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Apartment not found
    put:
      operationId: listings_update
      description: Handle retrieving, updating, and deleting a listing.
      summary: Update an apartment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApartmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApartmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApartmentCreateUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Validation Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Owner access required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Apartment not found
    patch:
      operationId: listings_partial_update
      description: Handle retrieving, updating, and deleting a listing.
      summary: Partially update an apartment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApartmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApartmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApartmentCreateUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Validation Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Owner access required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Apartment not found
    delete:
      operationId: listings_delete
      description: Handle retrieving, updating, and deleting a listing.
      summary: Delete an apartment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Listing deleted successfully
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Owner access required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Apartment not found
  /api/listings/history/:
    get:
      operationId: listings_history_list
      description: Retrieves the last 20 viewed apartments for the authenticated user.
      summary: Get user's view history
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingViewHistoryList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsControllerErrorResponse'
          description: Authentication required
  /api/listings/images/{id}/:
    delete:
      operationId: listings_images_destroy
      description: Allows an authenticated host to delete an image belonging to an
        apartment they own.
      summary: Delete an apartment image
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Image deleted successfully
        '401':
          description: Authentication required
        '403':
          description: Host access required
        '404':
          description: Image not found
  /api/listings/images/upload/:
    post:
      operationId: listings_images_upload_create
      description: Allows an authenticated host to upload an image for an apartment
        they own.
      summary: Upload an apartment image
      tags:
      - listings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApartmentImageUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartmentImage'
          description: ''
        '400':
          description: Validation Error
        '401':
          description: Authentication required
        '403':
          description: Host access required
  /api/listings/my/:
    get:
      operationId: listings_my_list
      description: Retrieves all listings owned by the authenticated host.
      summary: List host's own listings
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: district
        schema:
          type: string
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: max_rooms
        schema:
          type: integer
      - in: query
        name: min_price
        schema:
          type: number
      - in: query
        name: min_rooms
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: property_type
        schema:
          type: string
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApartmentList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingControllerErrorResponse'
          description: Host access required
  /api/listings/popular/:
    get:
      operationId: listings_popular_list
      description: Retrieves active listings ranked by views and review activity.
      summary: Get popular listings
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - listings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApartmentList'
          description: ''
  /api/listings/popular-searches/:
    get:
      operationId: listings_popular_searches
      summary: Fetch top 10 popular searches
      tags:
      - listings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularSearch'
          description: ''
  /api/reservations/:
    get:
      operationId: reservations_list
      description: Retrieves all reservations where the authenticated user is either
        the guest or the host.
      summary: List user-related reservations
      parameters:
      - in: query
        name: listing
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CONFIRMED
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending
          * `CONFIRMED` - Confirmed
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
      tags:
      - reservations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
    post:
      operationId: reservations_create
      description: Guest creates a booking request for a listing.
      summary: Create a new reservation
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Validation Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
  /api/reservations/{id}/:
    get:
      operationId: reservations_retrieve
      description: API view to retrieve, update, or cancel a specific reservation
        instance.
      summary: Retrieve a reservation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reservations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Reservation not found
    put:
      operationId: reservations_update
      description: API view to retrieve, update, or cancel a specific reservation
        instance.
      summary: Update a reservation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReservationUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Validation Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Reservation not found
    patch:
      operationId: reservations_partial_update
      description: API view to retrieve, update, or cancel a specific reservation
        instance.
      summary: Partially update a reservation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReservationUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReservationUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReservationUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Validation Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Reservation not found
    delete:
      operationId: reservations_delete
      description: API view to retrieve, update, or cancel a specific reservation
        instance.
      summary: Delete a reservation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reservations
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Reservation has been successfully deleted.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Only owner can delete
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Reservation not found
  /api/reservations/{id}/cancel/:
    post:
      operationId: reservations_cancel
      description: Action endpoint for quickly cancelling a reservation.
      summary: Cancel a reservation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reservations
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Reservation has been successfully cancelled.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: No permission to cancel
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Reservation not found
  /api/reservations/host/:
    get:
      operationId: reservations_host_list
      description: Retrieves all booking requests for listings owned by the authenticated
        host.
      summary: List host's incoming reservation requests
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CONFIRMED
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending
          * `CONFIRMED` - Confirmed
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
      tags:
      - reservations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
  /api/reservations/my/:
    get:
      operationId: reservations_my_list
      description: Retrieves all reservations booked by the authenticated guest user.
      summary: List guest's own reservations
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CONFIRMED
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending
          * `CONFIRMED` - Confirmed
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
      tags:
      - reservations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationControllerErrorResponse'
          description: Unauthorized
  /api/reviews/:
    get:
      operationId: reviews_list
      description: Public endpoint to list reviews. Can be filtered by rating or listing
        ID.
      summary: List or filter reviews
      parameters:
      - in: query
        name: listing
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: rating
        schema:
          type: integer
      tags:
      - reviews
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewList'
          description: ''
    post:
      operationId: reviews_create
      description: Requires authentication. User is automatically set from token.
      summary: Create a new review
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewControllerErrorResponse'
          description: Validation Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewControllerErrorResponse'
          description: Unauthorized
  /api/reviews/{id}/:
    get:
      operationId: reviews_retrieve
      summary: Retrieve review details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reviews
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewControllerErrorResponse'
          description: Review not found
    put:
      operationId: reviews_update
      summary: Update a review
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewControllerErrorResponse'
          description: Validation Error
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewControllerErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewControllerErrorResponse'
          description: Permission denied
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewControllerErrorResponse'
          description: Review not found
    patch:
      operationId: reviews_partial_update
      summary: Partially update a review
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reviews
      requestBody:
        content:
          application/json:
