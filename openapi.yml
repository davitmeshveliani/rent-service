          type: string
          readOnly: true
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - listing
      - rating
      - user
    ReviewControllerErrorResponse:
      type: object
      properties:
        detail:
          type: string
          default: Error detail message.
    ReviewRequest:
      type: object
      description: |-
        Serializer for creating and retrieving reviews.
        Delegates model constraints to Review.full_clean() and verifies stay completion.
      properties:
        listing:
          type: string
          format: uuid
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          nullable: true
      required:
      - listing
      - rating
    StatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - REJECTED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `CONFIRMED` - Confirmed
        * `REJECTED` - Rejected
        * `CANCELLED` - Cancelled
